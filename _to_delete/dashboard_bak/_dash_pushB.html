<title>AE5L600L — All running metrics</title>
<style>
:root { color-scheme: light dark; }
.viz-root {
  color-scheme: light;
  --surface-1:#fcfcfb; --page:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#008300; --s3:#e87ba4;
  --deemph:#c3c2b7; --wash:rgba(137,135,129,0.10);
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --era:#a9a79f;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --surface-1:#1a1a19; --page:#0d0d0d;
    --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#008300; --s3:#d55181;
    --deemph:#52514e; --wash:rgba(137,135,129,0.12);
    --era:#52514e;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --surface-1:#1a1a19; --page:#0d0d0d;
  --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;

}
* { box-sizing:border-box; margin:0; }
body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.viz-root { background:var(--page); color:var(--ink-1); min-height:100vh; padding-bottom:80px; }
header { padding:22px 28px 10px; }
header h1 { font-size:19px; font-weight:650; }
header .sub { color:var(--ink-2); font-size:12.5px; margin-top:4px; max-width:980px; line-height:1.5; }
.topbar { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.theme-toggle { margin-left:auto; font-size:12px; color:var(--ink-2); background:var(--surface-1);
  border:1px solid var(--border); border-radius:7px; padding:5px 10px; cursor:pointer; }
nav.secnav { position:sticky; top:0; z-index:30; background:var(--page); border-bottom:1px solid var(--grid);
  padding:8px 28px; display:flex; gap:4px; flex-wrap:wrap; }
nav.secnav a { font-size:12px; color:var(--ink-2); text-decoration:none; padding:4px 9px; border-radius:6px; }
nav.secnav a:hover { background:var(--wash); color:var(--ink-1); }
.filters { display:flex; gap:6px; padding:12px 28px 2px; align-items:center; flex-wrap:wrap; }
.filters .flabel { font-size:12px; color:var(--ink-3); margin-right:2px; }
.fbtn { font-size:12px; padding:5px 11px; border-radius:7px; border:1px solid var(--border);
  background:var(--surface-1); color:var(--ink-2); cursor:pointer; }
.fbtn[aria-pressed="true"] { color:var(--ink-1); font-weight:600; border-color:var(--axis); }
.fbtn[aria-pressed="true"]::before { content:"✓ "; font-weight:700; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; padding:14px 28px 4px; }
.tile { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:13px 15px; }
.tile .tl { font-size:11.5px; color:var(--ink-2); }
.tile .tv { font-size:26px; font-weight:600; margin-top:3px; }
.tile .td { font-size:11.5px; color:var(--ink-3); margin-top:3px; }
section.group { padding:6px 28px; }
section.group > h2 { font-size:14px; font-weight:650; margin:20px 0 2px; }
section.group > .gnote { font-size:12px; color:var(--ink-2); margin:2px 0 10px; max-width:980px; line-height:1.45; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
.card { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:10px 12px 6px; }
.card h3 { font-size:12.5px; font-weight:600; color:var(--ink-1); }
.card .unit { font-size:11px; color:var(--ink-3); font-weight:400; margin-left:4px; }
.card .csub { font-size:11px; color:var(--ink-3); margin-top:1px; }
.legend { display:flex; gap:12px; font-size:11px; color:var(--ink-2); margin:4px 0 0; flex-wrap:wrap; }
.legend .k { display:inline-flex; align-items:center; gap:5px; }
.legend .sw { width:14px; height:0; border-top:2.5px solid; border-radius:2px; display:inline-block; }
.legend .swo { width:8px; height:8px; border-radius:50%; border:2px solid; display:inline-block; }
svg.chart { display:block; width:100%; height:150px; margin-top:2px; }
svg.chart text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.tooltip { position:fixed; pointer-events:none; background:var(--surface-1); border:1px solid var(--border);
  border-radius:8px; box-shadow:0 4px 14px rgba(0,0,0,0.13); padding:8px 11px; font-size:11.5px; z-index:99;
  display:none; max-width:280px; }
.tooltip .tt-head { color:var(--ink-2); margin-bottom:4px; }
.tooltip .tt-row { display:flex; align-items:center; gap:6px; margin-top:2px; }
.tooltip .tt-key { width:12px; border-top:2.5px solid; border-radius:2px; }
.tooltip .tt-val { font-weight:650; color:var(--ink-1); }
.tooltip .tt-lab { color:var(--ink-2); }
details.tblwrap { margin:16px 0 0; }
details.tblwrap summary { font-size:12.5px; color:var(--ink-2); cursor:pointer; padding:6px 0; }
.tbl { overflow-x:auto; background:var(--surface-1); border:1px solid var(--border); border-radius:10px; }
table { border-collapse:collapse; font-size:11.5px; width:100%; }
th,td { padding:5px 9px; text-align:right; font-variant-numeric:tabular-nums; border-bottom:1px solid var(--grid); white-space:nowrap; }
th { color:var(--ink-2); font-weight:600; position:sticky; top:0; background:var(--surface-1); }
td:first-child, th:first-child { text-align:left; }
.storetbl td, .storetbl th { text-align:left; }
.stale { color:var(--serious); font-weight:600; }
.fresh { color:var(--good); font-weight:600; }
.footer { padding:26px 28px; color:var(--ink-3); font-size:11.5px; line-height:1.5; }

<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const N = D.logs.date.length;
const PCV_IDX = D.logs.name.findIndex(n => n.startsWith("6-21"));
const revBounds = [];
for (let i=1;i<N;i++) if (D.logs.rev[i]!==D.logs.rev[i-1]) revBounds.push(i);

/* ---------- theme toggle ---------- */
const themeBtn = document.getElementById("themeBtn");
let themeState = 0; // 0 auto, 1 light, 2 dark
themeBtn.addEventListener("click", () => {
  themeState = (themeState+1)%3;
  const r = document.documentElement;
  if (themeState===0){ r.removeAttribute("data-theme"); themeBtn.textContent="theme: auto"; }
  if (themeState===1){ r.setAttribute("data-theme","light"); themeBtn.textContent="theme: light"; }
  if (themeState===2){ r.setAttribute("data-theme","dark"); themeBtn.textContent="theme: dark"; }
});

/* ---------- range filter ---------- */
let range = [0, N-1];
const PRESETS = [
  ["All logs", 0],
  ["20.x era", D.logs.rev.findIndex(r=>r==="20.7")],
  ["Clean-PCV era", PCV_IDX],
  ["Last 10", Math.max(0,N-10)],
];
const filtersEl = document.getElementById("filters");
PRESETS.forEach(([label,start],i)=>{
  const b = document.createElement("button");
  b.className="fbtn"; b.type="button"; b.textContent=label;
  b.setAttribute("aria-pressed", i===0 ? "true":"false");
  b.addEventListener("click",()=>{
    filtersEl.querySelectorAll(".fbtn").forEach(x=>x.setAttribute("aria-pressed","false"));
    b.setAttribute("aria-pressed","true");
    range=[start,N-1]; renderAll();
  });
  filtersEl.appendChild(b);
});

/* ---------- chart renderer ---------- */
const tt = document.getElementById("tt");
const charts = [];
function fmt(v, dec){
  if (v===null||v===undefined||Number.isNaN(v)) return "–";
  const d = dec!==undefined?dec:(Math.abs(v)>=100?0:Math.abs(v)>=10?1:2);
  return v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
}
function niceTicks(lo,hi,n){
  if (lo===hi){ hi=lo+1; lo=lo-1; }
  const span=hi-lo, step0=span/Math.max(1,n), mag=Math.pow(10,Math.floor(Math.log10(step0)));
  let step=mag; for (const m of [1,2,2.5,5,10]) if (mag*m>=step0){ step=mag*m; break; }
  const t=[]; for(let v=Math.ceil(lo/step)*step; v<=hi+1e-9; v+=step) t.push(+v.toFixed(10));
  return t;
}
function css(name){ return getComputedStyle(document.body).getPropertyValue(name).trim(); }

// spec: {el, title, unit, sub, series:[{key,label,vals,colorVar,open?}], zeroLine, band:[lo,hi], refLines:[{y,label,colorVar}], preWash (bool: wash pre-PCV), dec, revLabels(bool)}
function makeChart(spec){
  const card = document.createElement("div"); card.className="card";
  const h3 = document.createElement("h3"); h3.textContent = spec.title;
  if (spec.unit){ const u=document.createElement("span"); u.className="unit"; u.textContent=spec.unit; h3.appendChild(u); }
  card.appendChild(h3);
  if (spec.sub){ const cs=document.createElement("div"); cs.className="csub"; cs.textContent=spec.sub; card.appendChild(cs); }
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","chart"); card.appendChild(svg);
  if (spec.series.length>1){
    const lg=document.createElement("div"); lg.className="legend";
    spec.series.forEach(s=>{
      const k=document.createElement("span"); k.className="k";
      const sw=document.createElement("span"); sw.className="sw"; sw.style.borderTopColor=`var(${s.colorVar})`;
      const t=document.createElement("span"); t.textContent=s.label;
      k.appendChild(sw); k.appendChild(t); lg.appendChild(k);
    });
    if (spec.openNote){
      const k=document.createElement("span"); k.className="k";
      const sw=document.createElement("span"); sw.className="swo"; sw.style.borderColor="var(--ink-3)";
      const t=document.createElement("span"); t.textContent=spec.openNote;
      k.appendChild(sw); k.appendChild(t); lg.appendChild(k);
    }
    card.appendChild(lg);
  } else if (spec.openNote){
    const lg=document.createElement("div"); lg.className="legend";
    const k=document.createElement("span"); k.className="k";
    const sw=document.createElement("span"); sw.className="swo"; sw.style.borderColor="var(--ink-3)";
    const t=document.createElement("span"); t.textContent=spec.openNote;
    k.appendChild(sw); k.appendChild(t); lg.appendChild(k); card.appendChild(lg);
  }
  spec.el.appendChild(card);
  const chart={spec,svg}; charts.push(chart); return chart;
}

function drawChart(ch){
  const {spec,svg}=ch;
  const [i0,i1]=range;
  const X = spec.xcats ? spec.xcats.map((_,i)=>i) : null;
  const idxs=[]; if (X){ for(let i=0;i<spec.xcats.length;i++) idxs.push(i); } else { for(let i=i0;i<=i1;i++) idxs.push(i); }
  const W = svg.clientWidth||330, Hh=150;
  svg.setAttribute("viewBox",`0 0 ${W} ${Hh}`);
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const ml=42,mr=10,mt=8,mb=20, pw=W-ml-mr, ph=Hh-mt-mb;
  let lo=Infinity,hi=-Infinity;
  spec.series.forEach(s=>idxs.forEach(i=>{ const v=s.vals[i]; if(v!==null&&v!==undefined&&!Number.isNaN(v)){ if(v<lo)lo=v; if(v>hi)hi=v; } }));
  if (spec.refLines) spec.refLines.forEach(r=>{ if(r.y<lo)lo=r.y; if(r.y>hi)hi=r.y; });
  if (spec.band){ if(spec.band[0]<lo)lo=spec.band[0]; if(spec.band[1]>hi)hi=spec.band[1]; }
  if (!isFinite(lo)){ lo=0; hi=1; }
  if (spec.zeroLine){ if(lo>0)lo=0; if(hi<0)hi=0; }
  let pad=(hi-lo)*0.08||0.5; lo-=pad; hi+=pad;
  if (spec.fixedRange){ lo=spec.fixedRange[0]; hi=spec.fixedRange[1]; }
  const xs=i=>{ const k=idxs.indexOf(i); return ml + (idxs.length===1?pw/2:(k/(idxs.length-1))*pw); };
  const ys=v=>mt+ph-((v-lo)/(hi-lo))*ph;
  const NS="http://www.w3.org/2000/svg";
  const el=(t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
  // band wash (ideal range)
  if (spec.band){
    svg.appendChild(el("rect",{x:ml,y:ys(spec.band[1]),width:pw,height:Math.max(0,ys(spec.band[0])-ys(spec.band[1])),fill:"var(--wash)"}));
  }
  // pre-PCV wash on fueling charts
  if (spec.preWash && !spec.xcats && i0<PCV_IDX){
    const xEnd = xs(Math.min(PCV_IDX,i1)) - (idxs.length>1?(pw/(idxs.length-1))/2:0);
    svg.appendChild(el("rect",{x:ml,y:mt,width:Math.max(0,xEnd-ml),height:ph,fill:"var(--wash)"}));
    const t=el("text",{x:ml+4,y:mt+11,"font-size":"9.5",fill:"var(--ink-3)"}); t.textContent="PCV-leak era"; svg.appendChild(t);
  }
  // gridlines + y ticks
  niceTicks(lo,hi,4).forEach(v=>{
    svg.appendChild(el("line",{x1:ml,x2:W-mr,y1:ys(v),y2:ys(v),stroke:"var(--grid)","stroke-width":1}));
    const t=el("text",{x:ml-6,y:ys(v)+3,"text-anchor":"end","font-size":"9.5",fill:"var(--ink-3)","font-variant-numeric":"tabular-nums"});
    t.textContent=fmt(v,undefined); svg.appendChild(t);
  });
  // zero line emphasis
  if (spec.zeroLine && lo<0 && hi>0)
    svg.appendChild(el("line",{x1:ml,x2:W-mr,y1:ys(0),y2:ys(0),stroke:"var(--axis)","stroke-width":1}));
  // rev boundaries (per-log charts only)
  if (!spec.xcats){
    revBounds.forEach(b=>{ if(b>i0&&b<=i1){
      const x=(xs(b)+xs(b-1))/2;
      svg.appendChild(el("line",{x1:x,x2:x,y1:mt,y2:mt+ph,stroke:"var(--era)","stroke-width":b===PCV_IDX?1.6:0.7,"stroke-opacity":b===PCV_IDX?0.9:0.55}));
    }});
  }
  // baseline
  svg.appendChild(el("line",{x1:ml,x2:W-mr,y1:mt+ph,y2:mt+ph,stroke:"var(--axis)","stroke-width":1}));
  // x labels
  if (spec.xcats){
    const step=Math.ceil(idxs.length/ (pw/46));
    idxs.forEach((i,k)=>{ if(k%step===0||k===idxs.length-1){
      const t=el("text",{x:xs(i),y:Hh-6,"text-anchor":"middle","font-size":"9",fill:"var(--ink-3)"});
      t.textContent=spec.xcats[i]; svg.appendChild(t);
    }});
  } else {
    const step=Math.ceil(idxs.length/(pw/62));
    idxs.forEach((i,k)=>{ if(k%step===0||k===idxs.length-1){
      const t=el("text",{x:xs(i),y:Hh-6,"text-anchor":"middle","font-size":"9",fill:"var(--ink-3)"});
      t.textContent=D.logs.date[i].slice(2).replace(/-/g,"/"); svg.appendChild(t);
    }});
  }
  // series
  spec.series.forEach(s=>{
    let dstr="", pen=false;
    idxs.forEach(i=>{
      const v=s.vals[i];
      if (v===null||v===undefined||Number.isNaN(v)){ pen=false; return; }
      dstr += (pen?"L":"M")+xs(i).toFixed(1)+","+ys(v).toFixed(1); pen=true;
    });
    if (dstr) svg.appendChild(el("path",{d:dstr,fill:"none",stroke:`var(${s.colorVar})`,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    idxs.forEach(i=>{
      const v=s.vals[i]; if (v===null||v===undefined||Number.isNaN(v)) return;
      const openPt = s.open && s.open[i];
      svg.appendChild(el("circle",{cx:xs(i),cy:ys(v),r:4,
        fill: openPt ? "var(--surface-1)" : `var(${s.colorVar})`,
        stroke: openPt ? `var(${s.colorVar})` : "var(--surface-1)","stroke-width":2}));
    });
  });
  // ref lines
  if (spec.refLines) spec.refLines.forEach(r=>{
    svg.appendChild(el("line",{x1:ml,x2:W-mr,y1:ys(r.y),y2:ys(r.y),stroke:`var(${r.colorVar||"--serious"})`,"stroke-width":1,"stroke-opacity":0.75}));
    const t=el("text",{x:W-mr-2,y:ys(r.y)-3,"text-anchor":"end","font-size":"9",fill:"var(--ink-2)"});
    t.textContent=r.label; svg.appendChild(t);
  });
  // crosshair + tooltip
  const cross=el("line",{y1:mt,y2:mt+ph,stroke:"var(--axis)","stroke-width":1,visibility:"hidden"});
  svg.appendChild(cross);
  const hit=el("rect",{x:0,y:0,width:W,height:Hh,fill:"transparent"});
  svg.appendChild(hit);
  function showTT(evt){
    const r=svg.getBoundingClientRect();
    const px=(evt.clientX-r.left)*(W/r.width);
    let best=idxs[0],bd=1e9;
    idxs.forEach(i=>{ const d=Math.abs(xs(i)-px); if(d<bd){bd=d;best=i;} });
    cross.setAttribute("x1",xs(best)); cross.setAttribute("x2",xs(best));
    cross.setAttribute("visibility","visible");
    while(tt.firstChild) tt.removeChild(tt.firstChild);
    const head=document.createElement("div"); head.className="tt-head";
    head.textContent = spec.xcats ? ("rev "+spec.xcats[best]) : (D.logs.date[best]+" · "+D.logs.rev[best]+" · "+D.logs.name[best]);
    tt.appendChild(head);
    spec.series.forEach(s=>{
      const row=document.createElement("div"); row.className="tt-row";
      const k=document.createElement("span"); k.className="tt-key"; k.style.borderTopColor=`var(${s.colorVar})`;
      const v=document.createElement("span"); v.className="tt-val"; v.textContent=fmt(s.vals[best],spec.dec);
      const l=document.createElement("span"); l.className="tt-lab"; l.textContent=s.label + (s.open&&s.open[best]?" (thin)":"");
      row.appendChild(k); row.appendChild(v); row.appendChild(l); tt.appendChild(row);
    });
    if (spec.context){
      spec.context.forEach(c=>{
        const cv=c.vals[best];
        const row=document.createElement("div"); row.className="tt-row";
        const k=document.createElement("span"); k.className="tt-key"; k.style.borderTopColor="transparent";
        const v=document.createElement("span"); v.className="tt-lab"; v.textContent=c.label+": "+fmt(cv,c.dec);
        row.appendChild(k); row.appendChild(v); tt.appendChild(row);
      });
    }
    tt.style.display="block";
    const tw=tt.offsetWidth, th_=tt.offsetHeight;
    let tx=evt.clientX+14, ty=evt.clientY-th_-8;
    if (tx+tw>window.innerWidth-8) tx=evt.clientX-tw-14;
    if (ty<8) ty=evt.clientY+14;
    tt.style.left=tx+"px"; tt.style.top=ty+"px";
  }
  hit.addEventListener("pointermove",showTT);
  hit.addEventListener("pointerleave",()=>{ tt.style.display="none"; cross.setAttribute("visibility","hidden"); });
}

  const {grid}=section("revgrain2","Rev-grain — tip-in split & DFCO recovery","Tip-in split separates real fueled-state stabs (the tuning target, blue) from DFCO/coast-resume events (gray — a wideband artifact, flat ~7.7 in every cal). DFCO recovery store last computed through 20.18.");
  const es=D.entry_split;
  makeChart({el:grid,title:"Tip-in lean by entry condition",unit:"AFR leaner than commanded",sub:"peak (wbo2 − FFB); DFCO-resume ~7.7 in every cal = wideband pegged during fuel cut, an artifact — the blue fueled-state line is the real signal",xcats:es.rev,
    series:[{label:"fueled-state (real)",vals:es.med_fueled,colorVar:"--s1"},{label:"DFCO-resume (artifact)",vals:es.med_dfco,colorVar:"--deemph"}],
    context:[{label:"n fueled",vals:es.n_fueled,dec:0},{label:"n total",vals:es.n_total,dec:0}]});
  makeChart({el:grid,title:"DFCO-entry share of tip-ins",unit:"%",xcats:es.rev,
    series:[{label:"% DFCO entry",vals:es.pct_dfco,colorVar:"--s1"}],zeroLine:true});
  const dc=D.dfco;
  makeChart({el:grid,title:"DFCO-resume peak lean",unit:"AFR leaner than commanded",xcats:dc.rev,series:[{label:"pk lean",vals:dc.pk_lean,colorVar:"--s1"}],context:[{label:"n resumes",vals:dc.n,dec:0}]});
  makeChart({el:grid,title:"DFCO recovery time",unit:"ms",xcats:dc.rev,series:[{label:"recov ms",vals:dc.recov_ms,colorVar:"--s1"}],zeroLine:true});
  makeChart({el:grid,title:"Unrecovered resumes",unit:"%",xcats:dc.rev,series:[{label:"% unrecovered",vals:dc.pct_unrec,colorVar:"--s1"}],zeroLine:true});
  makeChart({el:grid,title:"Air step at resume",unit:"g/s",xcats:dc.rev,series:[{label:"air step",vals:dc.air_step,colorVar:"--s1"}],zeroLine:true});
})();
